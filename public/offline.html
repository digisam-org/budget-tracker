<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline | Budget Tracker</title>
  <meta name="theme-color" content="#09090b" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 340px;
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 24px;
      padding: 28px 24px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #a1a1aa; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #10b981;
      color: #09090b;
      border: none;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're Offline</h1>
    <p>Budget Tracker couldn't reach your local server right now. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
